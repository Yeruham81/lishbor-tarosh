name: Full Project Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        shell: bash
        run: |
          if find . \
            -path ./node_modules -prune -o \
            -path ./dist -prune -o \
            -type f \( \
              -name "*.test.*" -o \
              -name "*_test_*" -o \
              -name "*.spec.*" -o \
              -name "*_spec_*" \
            \) -print -quit | grep -q .; then
            bun test
          else
            echo "::notice::No Bun test files found; skipping the test step."
          fi

      - name: Build
        run: bun run build
